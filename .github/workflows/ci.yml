name: CI

on:
  push:
    branches: [ main, master, develop, "feature/**" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FleetMaintenance.sln

      - name: Build
        run: dotnet build FleetMaintenance.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FleetMaintenance.sln --configuration Release --no-build --verbosity normal
